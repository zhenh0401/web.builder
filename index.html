<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Web Builder</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background 0.3s; }
  #app { display: grid; grid-template-columns: 220px 1fr 260px; grid-template-rows: 48px 1fr; height: 100vh; }
  #toolbar { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; padding: 0 12px; background: #1a1a1a; border-bottom: 1px solid #333; }
  #toolbar button { background: #252525; border: 1px solid #444; color: #fff; padding: 6px 12px; border-radius: 6px; cursor: pointer; font-size: 13px; }
  #left  { background: #1a1a1a; border-right: 1px solid #333; padding: 12px; overflow-y: auto; color: #fff; }
  #right { background: #1a1a1a; border-left: 1px solid #333; padding: 12px; overflow-y: auto; color: #fff; }
  
  #canvas-wrap { overflow: auto; background: #0a0a0a; display: flex; flex-direction: column; align-items: center; }
  
  #site-header {
    width: 100%; max-width: 1200px;
    min-height: 250px;
    display: flex; justify-content: space-between; align-items: flex-start;
    transition: all 0.3s;
  }

  #canvas {
    position: relative;
    width: 100%; max-width: 1200px; height: 800px;
    box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    transition: background 0.3s;
    margin-bottom: 24px;
  }
  
  .tool-group { display: flex; flex-direction: column; gap: 6px; }
  .tool-group button { background: #252525; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 6px; cursor: pointer; text-align: left; font-size: 13px; }
  .section-title { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: #666; margin: 16px 0 8px; }
  
  .resize-handle { position: absolute; width: 10px; height: 10px; background: #fff; border: 1px solid #2563eb; border-radius: 50%; z-index: 10; }
  .resize-handle.se { bottom: -5px; right: -5px; cursor: nwse-resize; }
  .resize-handle.sw { bottom: -5px; left: -5px; cursor: nesw-resize; }
  .resize-handle.ne { top: -5px; right: -5px; cursor: nesw-resize; }
  .resize-handle.nw { top: -5px; left: -5px; cursor: nwse-resize; }
</style>
</head>
<body>
<div id="app">
  <div id="toolbar">
    <button id="btn-export">Export HTML</button>
    <button id="btn-import">Import HTML</button>
    <input type="file" id="file-import" accept=".html" style="display:none">
  </div>
  <aside id="left">
    <div class="section-title">Add</div>
    <div class="tool-group">
      <button data-add="text">＋ Text</button>
      <button data-add="button">＋ Button</button>
      <button data-add="divider">＋ Divider</button>
      <button data-add="box">＋ Box</button>
      <button data-add="image">＋ Image</button>
      <button data-add="embed">＋ Embed HTML</button>
      <button data-add="collapsible">＋ Collapsible</button>
    </div>
  </aside>
  <main id="canvas-wrap">
    <div id="site-header"></div>
    <div id="canvas"></div>
  </main>
  <aside id="right">
    <div class="section-title">Properties</div>
    <div id="properties"></div>
  </aside>
</div>
<script type="module" src="./src/main.js"></script>
</body>
</html>
